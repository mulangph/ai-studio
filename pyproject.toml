[project]
name = "ai-creative-studio"
version = "0.2.0"
description = "Text-to-image studio with OpenAI GPT Image models, GPT-4o and local Stable Diffusion"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "accelerate>=1.14.0",
    "diffusers>=0.39.0",
    "fastapi>=0.139.2",
    "gradio>=6.20.0",
    "openai>=2.0.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.0.0",
    "safetensors>=0.8.0",
    "transformers>=5.14.1",
    "uvicorn>=0.51.0",
    "torch",
    "torchvision",
    "torchaudio",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
